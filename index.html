<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文興高中使用者辨識系統</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        /* 莫蘭迪奶茶色背景 */
        body {
            font-family: "PingFang TC", "Helvetica Neue", Helvetica, Arial, sans-serif;
            padding: 40px 20px;
            text-align: center;
            background-color: #E6DDD4; 
            color: #4A4A4A;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
        }

        /* 主卡片 */
        .login-card {
            background-color: #FFFFFF;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(108, 121, 133, 0.15);
            display: inline-block;
            max-width: 440px;
            width: 100%;
            border-top: 8px solid #8499A6; /* 霧霾藍飾條 */
            box-sizing: border-box;
        }

        h2 {
            color: #4E5E6A; /* 深霧霾藍 */
            font-size: 24px;
            margin-top: 0;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .subtitle {
            color: #8E8E8E;
            font-size: 14px;
            margin-bottom: 30px;
        }

        /* 淺奶茶色提醒區塊 */
        .notice-box {
            background-color: #F4EFEA;
            border-left: 4px solid #C4B5A5;
            padding: 15px;
            border-radius: 4px;
            text-align: left;
            margin-bottom: 25px;
            font-size: 13px;
            line-height: 1.6;
            color: #6E655F;
        }

        /* 同意勾選區 */
        .agree-container {
            display: flex;
            align-items: flex-start;
            justify-content: center;
            margin-bottom: 30px;
            cursor: pointer;
            font-size: 14px;
            color: #555555;
            user-select: none;
            text-align: left;
        }

        .agree-container input {
            margin-top: 3px;
            margin-right: 10px;
            accent-color: #8499A6;
        }

        /* 自訂莫蘭迪霧霾藍按鈕 */
        .custom-login-btn {
            background-color: #8499A6; 
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 24px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(132, 153, 166, 0.2);
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .custom-login-btn:hover {
            background-color: #6C7985; 
            box-shadow: 0 6px 12px rgba(108, 121, 133, 0.3);
        }

        /* 未勾選時的按鈕樣式 */
        .custom-login-btn.disabled {
            background-color: #D1C7BD; 
            color: #F4EFEA;
            box-shadow: none;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>文興高中辨識使用者頁面</h2>
        <div class="subtitle">資訊服務整合驗證</div>
        
        <div class="notice-box">
            <strong>💡 系統提示：</strong><br>
            本服務僅供校內業務流程與相關使用者識別驗證。進行下一階段前，請務必閱讀並勾選同意下方的資安與隱私宣告。
        </div>

        <label class="agree-container">
            <input type="checkbox" id="agreeCheckbox" onchange="updateButtonStatus()">
            <span>我同意授權本系統取得我的 Google 基本資料（Email 與姓名）以進行身分驗證。</span>
        </label>
        
        <button id="submitBtn" class="custom-login-btn disabled" onclick="handleLoginClick()">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 24 24">
                <path d="M12.24 10.285V13.4h6.887c-.275 1.565-1.88 4.604-6.887 4.604-4.33 0-7.866-3.577-7.866-8s3.536-8 7.866-8c2.46 0 4.105 1.025 5.047 1.926l2.427-2.334C17.955 2.192 15.34 1 12.24 1 6.033 1 1 6.033 1 12.24s5.033 11.24 11.24 11.24c6.478 0 10.793-4.537 10.793-10.986 0-.74-.08-1.305-.175-1.85H12.24z"/>
            </svg>
            使用 Google 帳號登入
        </button>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbzcnis1m2GrRmAy36jWa988AVRA3pdDoWYj4Vtwk3ShuosDKW9RngAmNw3Sk6yRvaEw0A/exec"; 
        let tokenClient;

        // 💡 核心變革：初始化改用 Token 彈出視窗機制，這天生完全不具備 One Tap（右上角氣泡）功能
        window.onload = function() {
            if (window.google && google.accounts && google.accounts.oauth2) {
                tokenClient = google.accounts.oauth2.initTokenClient({
                    client_id: "410768828548-iu7vf6j90b338l6gfldpj7r0gflok45u.apps.googleusercontent.com",
                    scope: "https://www.googleapis.com/auth/userinfo.profile https://www.googleapis.com/auth/userinfo.email",
                    callback: handleTokenResponse
                });
            }
        };

        // 即時動態改變自訂按鈕的視覺樣式
        function updateButtonStatus() {
            const isChecked = document.getElementById("agreeCheckbox").checked;
            const btn = document.getElementById("submitBtn");
            if (isChecked) {
                btn.classList.remove("disabled");
            } else {
                btn.classList.add("disabled");
            }
        }

        // 處理按鈕點擊事件 (物理攔截)
        function handleLoginClick() {
            const isChecked = document.getElementById("agreeCheckbox").checked;
            
            if (!isChecked) {
                alert("【系統提示】\n請先閱讀並勾選同意授權方可進行下一階段。");
                return;
            }
            
            // 👈 勾選同意後，直接彈出標準 Google 帳號選擇大視窗 (不經過右上角)
            if (tokenClient) {
                tokenClient.requestAccessToken();
            }
        }

        // 當使用者在標準彈出視窗選完帳號後，會觸發這個回呼
        async function handleTokenResponse(response) {
            if (response.error !== undefined) {
                return;
            }

            try {
                // 拿著 Access Token 直接跟 Google 官方 API 換取乾淨的使用者資料 (免前端解碼)
                const userInfoRes = await fetch("https://www.googleapis.com/oauth2/v3/userinfo", {
                    headers: { "Authorization": `Bearer ${response.access_token}` }
                });
                const userInfo = await userInfoRes.json();
                
                // 將極其精確的姓名與 Email 送交 GAS
                await fetch(GAS_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "text/plain" },
                    body: JSON.stringify({ email: userInfo.email, name: userInfo.name })
                });

                alert(`【驗證成功】\n歡迎，${userInfo.name} 先生/女士\n資料已順利登錄，請前往下一階段。`);
            } catch (err) {
                alert("通訊失敗，請重新嘗試。");
            }
        }
    </script>
</body>
</html>
