<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google 登入系統 (GitHub Pages 正式版)</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body style="font-family: Arial, sans-serif; padding: 40px; text-align: center; background-color: #f5f5f5;">

    <div style="background-color: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: inline-block; max-width: 400px; width: 100%;">
        <h2>Google 登入至 GAS 實驗</h2>
        <p style="color: #666; margin-bottom: 30px;">（校外人士跨網域相容版）</p>
        
        <div id="g_id_onload"
             data-client_id="410768828548-iu7vf6j90b338l6gfldpj7r0gflok45u.apps.googleusercontent.com"
             data-callback="handleCredentialResponse"
             data-ux_mode="popup">
        </div>
        <div class="g_id_signin" data-type="standard" style="display: inline-block;"></div>
    </div>

    <script>
        // 👈 請填入你最早之前支援 POST 接收、執行身分為「我」、權限為「所有人」的 GAS 網址！
        const GAS_URL = "https://script.google.com/macros/s/AKfycbzcnis1m2GrRmAy36jWa988AVRA3pdDoWYj4Vtwk3ShuosDKW9RngAmNw3Sk6yRvaEw0A/exec"; 

        function decodeJwt(token) {
            const base64Url = token.split('.')[1];
            const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            const jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        }

        async function handleCredentialResponse(response) {
            const payload = decodeJwt(response.credential);
            
            try {
                await fetch(GAS_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "text/plain" },
                    body: JSON.stringify({ email: payload.email, name: payload.name })
                });
                alert(`【寫入成功！】\n姓名: ${payload.name}\nEmail: ${payload.email}`);
            } catch (err) {
                alert("發送失敗");
            }
        }
    </script>
</body>
</html>
