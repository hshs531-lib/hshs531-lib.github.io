<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文興高中使用者辨識系統</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        /* 莫蘭迪奶茶色背景 */
        body {
            font-family: "PingFang TC", "Helvetica Neue", Helvetica, Arial, sans-serif;
            padding: 40px 20px;
            text-align: center;
            background-color: #E6DDD4; 
            color: #4A4A4A;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
        }

        /* 主卡片 */
        .login-card {
            background-color: #FFFFFF;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(108, 121, 133, 0.15);
            display: inline-block;
            max-width: 440px;
            width: 100%;
            border-top: 8px solid #8499A6; /* 霧霾藍飾條 */
            box-sizing: border-box;
        }

        h2 {
            color: #4E5E6A; /* 深霧霾藍 */
            font-size: 24px;
            margin-top: 0;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .subtitle {
            color: #8E8E8E;
            font-size: 14px;
            margin-bottom: 30px;
        }

        /* 淺奶茶色提醒區塊 */
        .notice-box {
            background-color: #F4EFEA;
            border-left: 4px solid #C4B5A5;
            padding: 15px;
            border-radius: 4px;
            text-align: left;
            margin-bottom: 25px;
            font-size: 13px;
            line-height: 1.6;
            color: #6E655F;
        }

        /* 同意勾選區 */
        .agree-container {
            display: flex;
            align-items: flex-start;
            justify-content: center;
            margin-bottom: 30px;
            cursor: pointer;
            font-size: 14px;
            color: #555555;
            user-select: none;
            text-align: left;
        }

        .agree-container input {
            margin-top: 3px;
            margin-right: 10px;
            accent-color: #8499A6;
        }

        /* 自訂莫蘭迪霧霾藍按鈕 (完全受我們控制，絕不走位) */
        .custom-login-btn {
            background-color: #8499A6; /* 霧霾藍 */
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 24px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(132, 153, 166, 0.2);
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .custom-login-btn:hover {
            background-color: #6C7985; /* 深霧霾藍 */
            box-shadow: 0 6px 12px rgba(108, 121, 133, 0.3);
        }

        /* 未勾選時的按鈕樣式 (變成淡淡灰色) */
        .custom-login-btn.disabled {
            background-color: #D1C7BD; /* 灰奶茶色 */
            color: #F4EFEA;
            box-shadow: none;
            cursor: not-allowed;
        }

        /* 隱藏 Google 官方原生按鈕骨架，只借用它的背後 SDK */
        #g_id_onload {
            display: none;
        }
    </style>
</head>
<body>

    <div id="g_id_onload"></div>

    <div class="login-card">
        <h2>文興高中辨識使用者頁面</h2>
        <div class="subtitle">資訊服務整合驗證</div>
        
        <div class="notice-box">
            <strong>💡 系統提示：</strong><br>
            本服務僅供校內業務流程與相關使用者識別驗證。進行下一階段前，請務必閱讀並勾選同意下方的資安與隱私宣告。
        </div>

        <label class="agree-container">
            <input type="checkbox" id="agreeCheckbox" onchange="updateButtonStatus()">
            <span>我同意授權本系統取得我的 Google 基本資料（Email 與姓名）以進行身分驗證。</span>
        </label>
        
        <button id="submitBtn" class="custom-login-btn disabled" onclick="handleLoginClick()">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 24 24">
                <path d="M12.24 10.285V13.4h6.887c-.275 1.565-1.88 4.604-6.887 4.604-4.33 0-7.866-3.577-7.866-8s3.536-8 7.866-8c2.46 0 4.105 1.025 5.047 1.926l2.427-2.334C17.955 2.192 15.34 1 12.24 1 6.033 1 1 6.033 1 12.24s5.033 11.24 11.24 11.24c6.478 0 10.793-4.537 10.793-10.986 0-.74-.08-1.305-.175-1.85H12.24z"/>
            </svg>
            使用 Google 帳號登入
        </button>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbzcnis1m2GrRmAy36jWa988AVRA3pdDoWYj4Vtwk3ShuosDKW9RngAmNw3Sk6yRvaEw0A/exec"; 

        // 核心修正：利用純 JS 初始化，並強制不顯示右上角 One Tap 提示
        window.onload = function() {
            if (window.google && google.accounts && google.accounts.id) {
                google.accounts.id.initialize({
                    client_id: "410768828548-iu7vf6j90b338l6gfldpj7r0gflok45u.apps.googleusercontent.com",
                    callback: handleCredentialResponse,
                    ux_mode: "popup",
                    auto_select: false // 關閉自動選擇
                });
                
                // 👈 終極大絕招：明確告訴 SDK，不要跳出右上角一鍵登入氣泡 (One Tap)
                google.accounts.id.cancel(); 
            }
        };

        // 即時動態改變自訂按鈕的視覺樣式
        function updateButtonStatus() {
            const isChecked = document.getElementById("agreeCheckbox").checked;
            const btn = document.getElementById("submitBtn");
            if (isChecked) {
                btn.classList.remove("disabled");
            } else {
                btn.classList.add("disabled");
            }
        }

        // 處理按鈕點擊事件 (物理攔截)
        function handleLoginClick() {
            const isChecked = document.getElementById("agreeCheckbox").checked;
            
            if (!isChecked) {
                // 如果沒勾選，直接跳出警告，並且絕對不執行登入流程！
                alert("【系統提示】\n請先閱讀並勾選同意授權方可進行下一階段。");
                return;
            }
            
            // 如果勾選了，才用 JS 程式碼主動喚起 Google 登入視窗 (Popup)
            google.accounts.id.prompt((notification) => {
                if (notification.isNotDisplayed() || notification.isSkippedMoment()) {
                    // 如果被瀏覽器阻擋，強迫再次彈出
                    google.accounts.id.prompt();
                }
            });
        }

        // 解碼 Token
        function decodeJwt(token) {
            const base64Url = token.split('.')[1];
            const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            const jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        }

        // 登入成功處理
        async function handleCredentialResponse(response) {
            const payload = decodeJwt(response.credential);
            
            try {
                await fetch(GAS_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "text/plain" },
                    body: JSON.stringify({ email: payload.email, name: payload.name })
                });
                alert(`【驗證成功】\n歡迎，${payload.name} 先生/女士\n資料已順利登錄，請前往下一階段。`);
            } catch (err) {
                alert("通訊失敗，請重新嘗試。");
            }
        }
    </script>
</body>
</html>
