<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文興高中使用者辨識系統</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        /* 莫蘭迪奶茶色背景 */
        body {
            font-family: "PingFang TC", "Helvetica Neue", Helvetica, Arial, sans-serif;
            padding: 40px 20px;
            text-align: center;
            background-color: #E6DDD4; /* 奶茶色基底 */
            color: #4A4A4A;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
        }

        /* 主卡片 */
        .login-card {
            background-color: #FFFFFF;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(108, 121, 133, 0.15);
            display: inline-block;
            max-width: 440px;
            width: 100%;
            border-top: 8px solid #8499A6; /* 霧霾藍飾條 */
            box-sizing: border-box;
        }

        h2 {
            color: #4E5E6A; /* 深霧霾藍 */
            font-size: 24px;
            margin-top: 0;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .subtitle {
            color: #8E8E8E;
            font-size: 14px;
            margin-bottom: 30px;
        }

        /* 淺奶茶色提醒區塊 */
        .notice-box {
            background-color: #F4EFEA;
            border-left: 4px solid #C4B5A5;
            padding: 15px;
            border-radius: 4px;
            text-align: left;
            margin-bottom: 25px;
            font-size: 13px;
            line-height: 1.6;
            color: #6E655F;
        }

        /* 同意勾選區 */
        .agree-container {
            display: flex;
            align-items: flex-start;
            justify-content: center;
            margin-bottom: 30px;
            cursor: pointer;
            font-size: 14px;
            color: #555555;
            user-select: none;
            text-align: left;
        }

        .agree-container input {
            margin-top: 3px;
            margin-right: 10px;
            accent-color: #8499A6;
        }

        /* 調整按鈕容器，包裹標準按鈕與遮罩 */
        .button-wrapper {
            position: relative;
            display: inline-block;
            width: 200px; /* 寬度與 Google 標準按鈕一致 */
            height: 40px; /* 高度與 Google 標準按鈕一致 */
            margin: 0 auto;
        }

        /* 修正重疊：遮罩完美覆蓋在按鈕正上方 */
        .disabled-mask {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #F4EFEA; /* 採用淺奶茶色，視覺更和諧 */
            cursor: not-allowed;
            border-radius: 20px; /* 圓角微調與按鈕一致 */
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            color: #7E8E9F;
            font-weight: bold;
            border: 1px dashed #8499A6;
            box-sizing: border-box;
            transition: all 0.2s ease-get;
            z-index: 10; /* 確保疊在 Google 按鈕最上方 */
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>文興高中辨識使用者頁面</h2>
        <div class="subtitle">資訊服務整合驗證</div>
        
        <div class="notice-box">
            <strong>💡 系統提示：</strong><br>
            本服務僅供校內業務流程與相關使用者識別驗證。進行下一階段前，請務必閱讀並勾選同意下方的資安與隱私宣告。
        </div>

        <label class="agree-container">
            <input type="checkbox" id="agreeCheckbox" onchange="toggleLoginButton()">
            <span>我同意授權本系統取得我的 Google 基本資料（Email 與姓名）以進行身分驗證。</span>
        </label>
        
        <div class="button-wrapper">
            <div id="g_id_onload"
                 data-client_id="410768828548-iu7vf6j90b338l6gfldpj7r0gflok45u.apps.googleusercontent.com"
                 data-callback="handleCredentialResponse"
                 data-ux_mode="popup"
                 data-auto_select="false">
            </div>
            <div class="g_id_signin" data-type="standard" data-shape="pill"></div>
            
            <div id="loginMask" class="disabled-mask">
                請先勾選同意條款
            </div>
        </div>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbzcnis1m2GrRmAy36jWa988AVRA3pdDoWYj4Vtwk3ShuosDKW9RngAmNw3Sk6yRvaEw0A/exec"; 

        // 頁面載入時，強制取消右上角的一鍵登入跳出
        window.onload = function() {
            if (window.google && google.accounts && google.accounts.id) {
                google.accounts.id.cancel(); 
            }
        };

        // 控制登入按鈕的解鎖機制
        function toggleLoginButton() {
            const isChecked = document.getElementById("agreeCheckbox").checked;
            const mask = document.getElementById("loginMask");
            if (isChecked) {
                mask.classList.add("hidden"); // 解鎖
            } else {
                mask.classList.remove("hidden"); // 鎖定
            }
        }

        // 解碼 Token
        function decodeJwt(token) {
            const base64Url = token.split('.')[1];
            const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            const jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        }

        // 登入成功處理
        async function handleCredentialResponse(response) {
            const payload = decodeJwt(response.credential);
            
            try {
                await fetch(GAS_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "text/plain" },
                    body: JSON.stringify({ email: payload.email, name: payload.name })
                });
                // 👈 已更換為指定的提示語句（先生/女士）
                alert(`【驗證成功】\n歡迎，${payload.name} 先生/女士\n資料已順利登錄，請前往下一階段。`);
            } catch (err) {
                alert("通訊失敗，請重新嘗試。");
            }
        }
    </script>
</body>
</html>
