<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文興高中使用者辨識系統</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        /* 莫蘭迪奶茶色背景 */
        body {
            font-family: "PingFang TC", "Helvetica Neue", Helvetica, Arial, sans-serif;
            padding: 40px 20px;
            text-align: center;
            background-color: #E6DDD4; /* 溫柔奶茶色基底 */
            color: #4A4A4A;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
        }

        /* 主卡片（帶有霧霾藍頂部飾條） */
        .login-card {
            background-color: #FFFFFF;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(108, 121, 133, 0.15);
            display: inline-block;
            max-width: 440px;
            width: 100%;
            border-top: 8px solid #8499A6; /* 莫蘭迪霧霾藍飾條 */
            box-sizing: border-box;
        }

        h2 {
            color: #4E5E6A; /* 深霧霾藍標題色 */
            font-size: 24px;
            margin-top: 0;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .subtitle {
            color: #8E8E8E;
            font-size: 14px;
            margin-bottom: 30px;
        }

        /* 淺奶茶色提醒區塊 */
        .notice-box {
            background-color: #F4EFEA;
            border-left: 4px solid #C4B5A5; /* 奶茶深色邊框 */
            padding: 15px;
            border-radius: 4px;
            text-align: left;
            margin-bottom: 25px;
            font-size: 13px;
            line-height: 1.6;
            color: #6E655F;
        }

        /* 同意勾選區 */
        .agree-container {
            display: flex;
            align-items: flex-start;
            justify-content: center;
            margin-bottom: 30px;
            cursor: pointer;
            font-size: 14px;
            color: #555555;
            user-select: none;
            text-align: left;
        }

        .agree-container input {
            margin-top: 3px;
            margin-right: 10px;
            accent-color: #8499A6; /* 勾選框指配霧霾藍 */
        }

        /* 莫蘭迪霧霾藍自訂按鈕 */
        .custom-login-btn {
            background-color: #8499A6; /* 高雅霧霾藍 */
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 24px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(132, 153, 166, 0.2);
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        /* 滑鼠懸停時的深霧霾藍優雅變色 */
        .custom-login-btn:hover {
            background-color: #6C7985; 
            box-shadow: 0 6px 12px rgba(108, 121, 133, 0.3);
        }

        /* 未勾選時的按鈕樣式（低飽和度灰奶茶色） */
        .custom-login-btn.disabled {
            background-color: #D1C7BD; 
            color: #F4EFEA;
            box-shadow: none;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>文興高中辨識使用者頁面</h2>
        <div class="subtitle">資訊服務整合驗證</div>
         
        <div class="notice-box">
            <strong>💡 系統提示：</strong><br>
            本服務僅供校內業務流程與相關使用者識別驗證。進行下一階段前，請務必閱讀並勾選同意下方的資安與隱私宣告。
        </div>

        <label class="agree-container">
            <input type="checkbox" id="agreeCheckbox" onchange="updateButtonStatus()">
            <span>我同意授權本系統取得我的 Google 基本資料（Email 與姓名）以進行身分驗證。</span>
        </label>
         
        <button id="submitBtn" class="custom-login-btn disabled" onclick="handleLoginClick()">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 24 24">
                <path d="M12.24 10.285V13.4h6.887c-.275 1.565-1.88 4.604-6.887 4.604-4.33 0-7.866-3.577-7.866-8s3.536-8 7.866-8c2.46 0 4.105 1.025 5.047 1.926l2.427-2.334C17.955 2.192 15.34 1 12.24 1 6.033 1 1 6.033 1 12.24s5.033 11.24 11.24 11.24c6.478 0 10.793-4.537 10.793-10.986 0-.74-.08-1.305-.175-1.85H12.24z"/>
            </svg>
            使用 Google 帳號登入
        </button>
    </div>

    <script>
        // 1. 🔍 核心機制：一進入網頁，立刻解析網址參數，檢查是不是其他子系統（如 A GAS）踢過來的
        const urlParams = new URLSearchParams(window.location.search);
        const redirectTarget = urlParams.get('redirect'); // 抓取要送回快遞的 A GAS 網址

        // 中央總日誌 GAS 網址（依舊在後端默默記錄每一次登入）
        const CENTRAL_LOG_GAS_URL = "https://script.google.com/macros/s/AKfycbzcnis1m2GrRmAy36jWa988AVRA3pdDoWYj4Vtwk3ShuosDKW9RngAmNw3Sk6yRvaEw0A/exec"; 
        let tokenClient;

        // 初始化 Token 視窗機制（天生免疫右上角 One Tap 氣泡提示）
        window.onload = function() {
            if (window.google && google.accounts && google.accounts.oauth2) {
                tokenClient = google.accounts.oauth2.initTokenClient({
                    client_id: "410768828548-iu7vf6j90b338l6gfldpj7r0gflok45u.apps.googleusercontent.com",
                    scope: "https://www.googleapis.com/auth/userinfo.profile https://www.googleapis.com/auth/userinfo.email",
                    callback: handleTokenResponse
                });
            }
        };

        // 動態控制中央按鈕外觀樣式
        function updateButtonStatus() {
            const isChecked = document.getElementById("agreeCheckbox").checked;
            const btn = document.getElementById("submitBtn");
            if (isChecked) {
                btn.classList.remove("disabled");
            } else {
                btn.classList.add("disabled");
            }
        }

        // 物理點擊攔截機制
        function handleLoginClick() {
            const isChecked = document.getElementById("agreeCheckbox").checked;
            
            if (!isChecked) {
                alert("【系統提示】\n請先閱讀並勾選同意授權方可進行下一階段。");
                return;
            }
            
            if (tokenClient) {
                tokenClient.requestAccessToken();
            }
        }

        // 授權完畢後的回呼處理
        async function handleTokenResponse(response) {
            if (response.error !== undefined) {
                alert("授權失敗，使用者取消或發生錯誤。");
                return;
            }

            try {
                // A. 拿著 Access Token 向 Google 換取真實使用者完整資料
                const userInfoRes = await fetch("https://www.googleapis.com/oauth2/v3/userinfo", {
                    headers: { "Authorization": `Bearer ${response.access_token}` }
                });
                const userInfo = await userInfoRes.json();
                
                // B. 發送給中央總日誌 GAS 寫入試算表留底（使用非同步背景發送，不阻礙轉址速度）
                fetch(CENTRAL_LOG_GAS_URL, {
                    method: "POST",
                    mode: "cors", 
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({ email: userInfo.email, name: userInfo.name })
                }).catch(e => console.error("日誌紀錄失敗：", e));

                // C. 彈出帶有尊稱的成功提示
                alert(`【驗證成功】\n歡迎，${userInfo.name} 先生/女士\n驗證成功，即將為您導回系統...`);
                
                // D. 🚀【SSO 關鍵實現：打包快遞送回 A GAS】
                if (redirectTarget) {
                    // 如果當初 A GAS 有交代回程地址，原路把資料用 URL 參數打包遞送回去
                    window.location.href = `${redirectTarget}?email=${encodeURIComponent(userInfo.email)}&name=${encodeURIComponent(userInfo.name)}`;
                } else {
                    // 防呆：如果是直接點開 GitHub 門戶首頁（不是子系統轉過來的）
                    alert(`驗證完成！您的電子郵件為：${userInfo.email}`);
                }

            } catch (err) {
                alert("通訊失敗或後端未回應，請重新嘗試。");
                console.error(err);
            }
        }
    </script>
</body>
</html>
